deptrac:
  # Analysed source. Listed literally (no globs): the host application, every
  # packages/*/src, every services/*/src and every services/*/tests. Adding a new,
  # permanent service package means adding its two paths, one layer and one ruleset
  # entry here.
  #
  # Test code is boundary-checked too, and needs no layer of its own: layers are
  # matched by namespace, not by directory, so a class declared under
  # Flexipos\Service\Demo\ is inside the Service_Demo layer whether its file lives
  # in src/ or in tests/.
  paths:
    - app
    # The host's own test directory (FP-169). Unlike a service package's tests,
    # this one needs a layer of its own: the host's Pest files declare no
    # classes and the shared infrastructure declares Tests\*, which belonged to
    # no layer, so nothing in here could ever be the depender in a rule and the
    # path alone was inert. Measured: path only = 0 violations and no new
    # covered class; path + the HostTests layer below = the import of a service
    # internal from a host test becomes reportable.
    - tests
    - ../demo/src
    - ../demo/tests
    - ../../packages/auth/src
    - ../../packages/contracts/src
    - ../../packages/eventbus/src
    # Str::studly('http-client') === 'HttpClient'; the directory stays kebab-case.
    - ../../packages/http-client/src
    - ../../packages/kernel/src
    - ../../packages/kernel/tests
    # Str::studly('plugin-sdk') === 'PluginSdk'; the directory stays kebab-case.
    - ../../packages/plugin-sdk/src
    - ../../packages/testing/src

  layers:
    - name: HostApp
      collectors:
        - type: classLike
          value: ^App\\.*

    # The host's own test code (FP-169). Separate from HostApp so its ruleset can
    # be the narrower one: a host test may reach the host application and any
    # shared package, but never a service package's internals. Deliberately NOT
    # granted any Service_* layer - that omission is the whole point, and it is
    # what makes a host test importing a service internal a reportable
    # violation. Intra-layer dependencies are allowed by Deptrac, so the
    # Tests\Fixtures\DeptracViolation\* stand-ins stay silent here.
    - name: HostTests
      collectors:
        - type: classLike
          value: ^Tests\\.*

    # One layer per service package, so a dependency from one service onto
    # another is a violation instead of an internal edge of a shared layer.
    - name: Service_Demo
      collectors:
        - type: classLike
          value: ^Flexipos\\Service\\Demo\\.*

    - name: Package_Auth
      collectors:
        - type: classLike
          value: ^Flexipos\\Auth\\.*

    - name: Package_Contracts
      collectors:
        - type: classLike
          value: ^Flexipos\\Contracts\\.*

    - name: Package_Eventbus
      collectors:
        - type: classLike
          value: ^Flexipos\\Eventbus\\.*

    # Str::studly('http-client') === 'HttpClient' — the namespace is not a literal
    # transliteration of the hyphenated package directory name.
    - name: Package_HttpClient
      collectors:
        - type: classLike
          value: ^Flexipos\\HttpClient\\.*

    - name: Package_Kernel
      collectors:
        - type: classLike
          value: ^Flexipos\\Kernel\\.*

    # Str::studly('plugin-sdk') === 'PluginSdk' — see the note above.
    - name: Package_PluginSdk
      collectors:
        - type: classLike
          value: ^Flexipos\\PluginSdk\\.*

    - name: Package_Testing
      collectors:
        - type: classLike
          value: ^Flexipos\\Testing\\.*

  # A service layer may depend only on shared packages/* layers — never on another
  # service layer. packages/* layers depend on nothing (`~`).
  ruleset:
    HostApp:
      - Package_Auth
      - Package_Contracts
      - Package_Eventbus
      - Package_HttpClient
      - Package_Kernel
      - Package_PluginSdk
      - Package_Testing

    # The host's tests may use the host application and the shared packages.
    # No Service_* layer appears here on purpose: see the layer comment above.
    HostTests:
      - HostApp
      - Package_Auth
      - Package_Contracts
      - Package_Eventbus
      - Package_HttpClient
      - Package_Kernel
      - Package_PluginSdk
      - Package_Testing

    Service_Demo:
      - Package_Auth
      - Package_Contracts
      - Package_Eventbus
      - Package_HttpClient
      - Package_Kernel
      - Package_PluginSdk
      - Package_Testing

    Package_Auth: ~
    Package_Contracts: ~
    Package_Eventbus: ~
    Package_HttpClient: ~
    Package_Kernel: ~
    Package_PluginSdk: ~
    Package_Testing: ~
