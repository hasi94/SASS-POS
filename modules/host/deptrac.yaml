deptrac:
  # Analysed source. Listed literally (no globs): the host application, every
  # packages/*/src, every modules/*/src and every modules/*/tests. Adding a new,
  # permanent module means adding its two paths, one layer and one ruleset
  # entry here.
  #
  # Test code is boundary-checked too, and needs no layer of its own: layers are
  # matched by namespace, not by directory, so a class declared under
  # Flexipos\Module\Demo\ is inside the Module_Demo layer whether its file lives
  # in src/ or in tests/.
  paths:
    - app
    # The host's own test directory (FP-169). Unlike a module's tests,
    # this one needs a layer of its own: the host's Pest files declare no
    # classes and the shared infrastructure declares Tests\*, which belonged to
    # no layer, so nothing in here could ever be the depender in a rule and the
    # path alone was inert. Measured: path only = 0 violations and no new
    # covered class; path + the HostTests layer below = the import of a module
    # internal from a host test becomes reportable.
    - tests
    - ../demo/src
    - ../demo/tests
    # The access package (T-010 step 1). Unlike every other test tree here,
    # this one is registered *and* collected: its files declare
    # Flexipos\Access\Tests\..., so the Package_Access layer below matches
    # them. The three trees for which registration is still inert are recorded
    # in qaGlobalNamespaceTestTrees() against FP-303; this adds no fourth.
    - ../../packages/access/src
    - ../../packages/access/tests
    - ../../packages/auth/src
    # The auth package's tests (T-009 step 5b), for the reason stated
    # above: a layer is matched by namespace and not by directory, and
    # these were in neither registry.
    - ../../packages/auth/tests
    - ../../packages/contracts/src
    - ../../packages/eventbus/src
    # Str::studly('http-client') === 'HttpClient'; the directory stays kebab-case.
    - ../../packages/http-client/src
    - ../../packages/kernel/src
    - ../../packages/kernel/tests
    # The organization package (T-014 step 2): branches, locations, terminals,
    # devices, activation and the settings hierarchy. Registered with its test
    # tree, whose files declare Flexipos\Organization\Tests\..., so the
    # Package_Organization_Tests layer below matches them.
    - ../../packages/organization/src
    - ../../packages/organization/tests
    # Str::studly('plugin-sdk') === 'PluginSdk'; the directory stays kebab-case.
    - ../../packages/plugin-sdk/src
    - ../../packages/testing/src

  layers:
    - name: HostApp
      collectors:
        - type: classLike
          value: ^App\\.*

    # The host's own test code (FP-169). Separate from HostApp so its ruleset can
    # be the narrower one: a host test may reach the host application and any
    # shared package, but never a module's internals. Deliberately NOT
    # granted any Module_* layer - that omission is the whole point, and it is
    # what makes a host test importing a module internal a reportable
    # violation. Intra-layer dependencies are allowed by Deptrac, so the
    # Tests\Fixtures\DeptracViolation\* stand-ins stay silent here.
    - name: HostTests
      collectors:
        - type: classLike
          value: ^Tests\\.*

    # One layer per module, so a dependency from one module onto
    # another is a violation instead of an internal edge of a shared layer.
    - name: Module_Demo
      collectors:
        - type: classLike
          value: ^Flexipos\\Module\\Demo\\.*

    # T-010. The tenant-local authorization package: employees, roles,
    # branch-scoped permissions, PINs and the resolver. The pattern covers
    # Flexipos\Access\Tests\... as well, so this package's test code is
    # boundary-checked like its source - which is the first time that is true
    # of a package test tree here.
    - name: Package_Access
      collectors:
        - type: classLike
          value: ^Flexipos\\Access\\.*

    - name: Package_Auth
      collectors:
        - type: classLike
          value: ^Flexipos\\Auth\\.*

    - name: Package_Contracts
      collectors:
        - type: classLike
          value: ^Flexipos\\Contracts\\.*

    - name: Package_Eventbus
      collectors:
        - type: classLike
          value: ^Flexipos\\Eventbus\\.*

    # Str::studly('http-client') === 'HttpClient' — the namespace is not a literal
    # transliteration of the hyphenated package directory name.
    - name: Package_HttpClient
      collectors:
        - type: classLike
          value: ^Flexipos\\HttpClient\\.*

    # Everything in the kernel except the three tenant-database status
    # symbols, which the next layer owns. The negative lookahead keeps the
    # two layers disjoint: a token in both would be matched twice and
    # Deptrac would warn on every run.
    - name: Package_Kernel
      collectors:
        - type: classLike
          value: ^Flexipos\\Kernel\\(?!Tenancy\\(TenantConnectionPurpose|TenantDatabase|TenantStatusPolicy)$).*

    # T-009 section 9. The three symbols that decide whether a tenant
    # *database* is served: the serving-status list, the mapping row that
    # carries the status, and the policy that reads them. Nothing moved on
    # disk - they stay in the kernel's Tenancy namespace - but they are a
    # layer of their own so a ruleset can grant the kernel without granting
    # them.
    #
    # Package_Auth is granted Package_Kernel and deliberately NOT this
    # layer. That omission is the instrument for AC-47's *symbol* half, and
    # the wording matters: it proves that authentication holds no **type
    # reference** - a `use`, a type hint, a `::class`, a catch type - to one
    # of these three, however it is imported, aliased or re-exported, with
    # no exemption available. It must never be described as proving that
    # authentication holds no **copy of the status list**. Measured twice
    # (plan section 9): the collector is `classLike`, the resolved type
    # graph, and it does not read class names out of string literals - the
    # FQCN in double quotes, in single quotes, as a [FQCN, 'method']
    # callable and as `new $className` all produce zero violations, as does
    # a class holding ['active', 'read_only'] with an in_array() over it.
    # Value copying, which is exactly what T-008's scan existed to catch, is
    # invisible here and is carried behaviourally instead: step 13's
    # TenantDatabaseNotActive plus a never-called handler spy, and step 6's
    # moved-value proof for TenantSelectionPolicy.
    - name: Package_Kernel_TenancyStatus
      collectors:
        - type: classLike
          value: ^Flexipos\\Kernel\\Tenancy\\(TenantConnectionPurpose|TenantDatabase|TenantStatusPolicy)$

    # T-014. The tenant-local organization package. Two layers, the second
    # carved out by namespace so the package's tests may reach the access
    # fixtures (which seed employees) while its source stays bound to the
    # kernel and the contracts. The first pattern excludes `Tests\`, so a class
    # is in exactly one of them and Deptrac never warns about a double match.
    - name: Package_Organization
      collectors:
        - type: classLike
          value: ^Flexipos\\Organization\\(?!Tests\\).*

    - name: Package_Organization_Tests
      collectors:
        - type: classLike
          value: ^Flexipos\\Organization\\Tests\\.*

    # Str::studly('plugin-sdk') === 'PluginSdk' — see the note above.
    - name: Package_PluginSdk
      collectors:
        - type: classLike
          value: ^Flexipos\\PluginSdk\\.*

    - name: Package_Testing
      collectors:
        - type: classLike
          value: ^Flexipos\\Testing\\.*

  # A module layer may depend only on shared packages/* layers — never on another
  # module layer. packages/* layers depend on nothing (`~`).
  ruleset:
    HostApp:
      - Package_Access
      - Package_Auth
      - Package_Contracts
      - Package_Eventbus
      - Package_HttpClient
      - Package_Kernel
      - Package_Kernel_TenancyStatus
      - Package_Organization
      - Package_PluginSdk
      - Package_Testing

    # The host's tests may use the host application and the shared packages.
    # No Module_* layer appears here on purpose: see the layer comment above.
    # Package_Access is granted here as well as to HostApp. The host's own
    # tests are where the access HTTP surface, the two middleware and the
    # cross-package criteria are proved from (plan section 7), so withholding
    # it would make the qa-owned tests of steps 19 to 24 unwritable. The
    # omission that carries AC-11 is Module_Demo's, below, and it is
    # unaffected.
    HostTests:
      - HostApp
      - Package_Access
      - Package_Auth
      - Package_Contracts
      - Package_Eventbus
      - Package_HttpClient
      - Package_Kernel
      - Package_Kernel_TenancyStatus
      - Package_Organization
      - Package_Organization_Tests
      - Package_PluginSdk
      - Package_Testing

    # Package_Access is deliberately absent, and the omission is AC-11's
    # instrument: a module reaching into the access tables' own classes is a
    # reportable violation from day one, while the same module asking the
    # authorization question through Flexipos\Contracts\Access is not. The
    # pair is what discriminates - both are "a reference"; only one is
    # forbidden. Stated limit (T-009 D-33): this proves the absence of *type
    # references* only. It cannot see a table name in a string, which is why
    # AC-2's and AC-73's query-log scans carry that half.
    Module_Demo:
      - Package_Auth
      - Package_Contracts
      - Package_Eventbus
      - Package_HttpClient
      - Package_Kernel
      - Package_Kernel_TenancyStatus
      - Package_PluginSdk
      - Package_Testing

    # T-009 step 1. Widened from `~` so authentication may use the kernel
    # (RunnerClock, IdentifierColumn, Tenancy) and other modules' published
    # contracts; docs/patterns.md section 4.1 grants exactly this edge. It
    # is a new *allowed edge*, not an exemption - nothing is silenced and no
    # baseline or skip list is touched. Package_Kernel_TenancyStatus is
    # withheld on purpose; see that layer's comment.
    # T-010 step 1. The access package reads the kernel (IdentifierColumn,
    # RunnerClock, Tenancy) and publishes its surface through
    # packages/contracts. Package_Kernel_TenancyStatus is withheld for the
    # same reason it is withheld from authentication: deciding whether a
    # tenant *database* is served is not this package's question.
    #
    # Nothing is granted *to* Package_Auth here. Authentication reaches the
    # employee-derived claims through Flexipos\Contracts\Access\
    # EmployeeClaimSource, an edge it already has, so T-010 adds no allowed
    # edge to authentication at all.
    Package_Access:
      - Package_Kernel
      - Package_Contracts
    Package_Auth:
      - Package_Kernel
      - Package_Contracts
    Package_Contracts: ~
    Package_Eventbus: ~
    Package_HttpClient: ~
    # The kernel's own features - the migration planner, the connection
    # factory - read the status symbols, so the carve-out needs this one
    # edge back.
    Package_Kernel:
      - Package_Kernel_TenancyStatus
    # The status symbols read the rest of the kernel; the carve-out is
    # about who may read *them*, not about isolating them.
    Package_Kernel_TenancyStatus:
      - Package_Kernel
    # T-014. Source reaches the kernel and the published contracts only. It
    # never imports access or auth: it asks them through
    # Flexipos\Contracts\*, so a type reference to either is a reportable
    # violation. Its tests are the one place that may reach access's fixtures.
    Package_Organization:
      - Package_Kernel
      - Package_Contracts
    Package_Organization_Tests:
      - Package_Organization
      - Package_Access
      - Package_Contracts
      - Package_Kernel
    Package_PluginSdk: ~
    Package_Testing: ~
