# Fixture only. Two stand-in module layers where one reaches into the other,
# mirroring the shipped deptrac.yaml ruleset: a module layer may never depend
# on another module layer. DeptracBoundaryEnforcementTest runs Deptrac against
# this file and expects a non-zero exit code naming both layers.
deptrac:
  paths:
    - ModuleA
    - ModuleB

  exclude_files: []

  layers:
    - name: Module_A
      collectors:
        - type: classLike
          value: ^Tests\\Fixtures\\DeptracViolation\\ModuleA\\.*

    - name: Module_B
      collectors:
        - type: classLike
          value: ^Tests\\Fixtures\\DeptracViolation\\ModuleB\\.*

  ruleset:
    Module_A: ~
    Module_B: ~
